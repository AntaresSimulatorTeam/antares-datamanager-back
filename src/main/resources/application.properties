# ===============================
# = SPRING
# ===============================
server.port=8093
management.endpoints.web.exposure.include=*
management.health.db.enabled=false
server.forward-headers-strategy=framework
# ===============================
# = JPA / HIBERNATE
# ===============================
logging.level.root=warn
logging.level.org.springframework.web=INFO
logging.level.com.rte_france.antares.datamanager_back=${PEGASE_LOGGING_LEVEL:INFO}
#logging.config=classpath:logback-spring.xml

# ===============================
# = DATA SOURCE
# ===============================
spring.datasource.url=${PEGASE_DATASOURCE_URL}?currentSchema=${PEGASE_DATASOURCE_SCHEMA}
spring.datasource.username=${PEGASE_POSTGRES_RW_USER}
spring.datasource.password=${PEGASE_POSTGRES_RW_PWD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${PEGASE_DATASOURCE_SCHEMA}
#spring.jpa.open-in-view=true

# ===============================
# = Liquibase
# ===============================
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=${PEGASE_DATASOURCE_SCHEMA}
spring.liquibase.liquibase-schema=${PEGASE_DATASOURCE_SCHEMA}
spring.liquibase.user=${PEGASE_POSTGRES_ADMIN_USER}
spring.liquibase.password=${PEGASE_POSTGRES_ADMIN_PWD}

# ===============================
# = FILES
# ===============================

antares.datamanager.trajectory.file.path=${PEGASE_TRAJECTORY_FILE_PATH}
antares.datamanager.area.directory=${PEGASE_AREA_DIRECTORY}
antares.datamanager.link.directory=${PEGASE_LINK_DIRECTORY}
antares.datamanager.thermal.cost.directory=${PEGASE_COST_DIRECTORY}
antares.datamanager.thermal.capacity.directory=${PEGASE_CAPACITY_DIRECTORY}
antares.datamanager.thermal.parameter.directory=${PEGASE_PARAMETER_DIRECTORY}
antares.datamanager.load.directory=${PEGASE_LOAD_DIRECTORY}


spring.security.oauth2.resourceserver.opaquetoken.introspection-uri=${PEGASE_OAUTH2_INTROSPECTION_URI}
spring.security.oauth2.resourceserver.opaquetoken.client-id=${PEGASE_OAUTH2_CLIENT_ID}
spring.security.oauth2.resourceserver.opaquetoken.client-secret=

pegase.nas.directory=/pegase/data
peagse.genarator.host.url=${PEGASE_GENERATOR_HOST_URL}