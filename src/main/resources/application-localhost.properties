# ===============================

# ===============================
# = DATA SOURCE
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5434/pegase_local_db?currentSchema=pegase_local_db_schema
spring.datasource.username=postgres
spring.datasource.password=

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
management.health.ldap.enabled=false

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=pegase_local_db_schema
logging.level.org.hibernate.stat=DEBUG
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
# ===============================
# = Liquibase
# ===============================
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=pegase_local_db_schema
spring.liquibase.liquibase-schema=pegase_local_db_schema
spring.liquibase.user=postgres
spring.liquibase.password=

# ===============================
# = FILES
# ===============================

antares.datamanager.trajectory.file.path=INPUT
antares.datamanager.area.directory=area
antares.datamanager.link.directory=link
antares.datamanager.thermal.cost.directory=
antares.datamanager.thermal.economic.directory=
antares.datamanager.thermal.capacity.directory=
antares.datamanager.thermal.parameter.directory=
antares.datamanager.thermal.parameter.modulation.directory=
antares.datamanager.load.directory=load
antares.datamanager.load.output.directory=output/load_arrows
antares.datamanager.thermal.modulation.output.directory=output/thermal_modulation_arrow
antares.datamanager.study.json.output.directory=output/study_json


spring.security.oauth2.resourceserver.opaquetoken.introspection-uri=http://localhost:9090/token/introspection
spring.security.oauth2.resourceserver.opaquetoken.client-id=
spring.security.oauth2.resourceserver.opaquetoken.client-secret=

pegase.nas.directory=tmp/mnt/nas
pegase.enable.authentification=false
peagse.genarator.host.url=http://localhost:8094

