# ===============================
# = DATA SOURCE
# ===============================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.datasource.url=jdbc:h2:mem:test_pegase;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.type=org.springframework.jdbc.datasource.SimpleDriverDataSource

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.hbm2ddl.charset_name=UTF-8
spring.ldap.embedded.ldif=classpath:gaia/gaia-ldap-server.ldif
spring.ldap.embedded.base-dn=o=rte
spring.ldap.embedded.validation.enabled=false
spring.ldap.embedded.port=${random.int[10000,20000]}

