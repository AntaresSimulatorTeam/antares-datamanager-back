# ===============================
# = SPRING
# ===============================
server.port=8093
server.forward-headers-strategy=framework
management.endpoints.web.exposure.include=*
management.health.db.enabled=false
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.info.build.enabled=true
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=*
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@
# ===============================
# = JPA / HIBERNATE
# ===============================
logging.level.root=warn
logging.level.org.springframework.web=INFO
logging.level.com.rte_france.antares.datamanager_back=${PEGASE_LOGGING_LEVEL:INFO}

# ===============================
# = DATA SOURCE
# ===============================
spring.datasource.url=${PEGASE_DATASOURCE_URL}?currentSchema=${PEGASE_DATASOURCE_SCHEMA}
spring.datasource.username=${PEGASE_POSTGRES_RW_USER}
spring.datasource.password=${PEGASE_POSTGRES_RW_PWD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${PEGASE_DATASOURCE_SCHEMA}
#spring.jpa.open-in-view=true

# ===============================
# = Liquibase
# ===============================
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=${PEGASE_DATASOURCE_SCHEMA}
spring.liquibase.liquibase-schema=${PEGASE_DATASOURCE_SCHEMA}
spring.liquibase.user=${PEGASE_POSTGRES_ADMIN_USER}
spring.liquibase.password=${PEGASE_POSTGRES_ADMIN_PWD}

# ===============================
# = FILES
# ===============================

antares.datamanager.trajectory.file.path=${PEGASE_TRAJECTORY_FILE_PATH}
antares.datamanager.area.directory=${PEGASE_AREA_DIRECTORY}
antares.datamanager.link.directory=${PEGASE_LINK_DIRECTORY}

antares.datamanager.thermal.cost.directory=${PEGASE_COST_DIRECTORY}
antares.datamanager.thermal.economic.directory=${PEGASE_ECONOMIC_DIRECTORY}
antares.datamanager.thermal.capacity.directory=${PEGASE_CAPACITY_DIRECTORY}
antares.datamanager.thermal.parameter.directory=${PEGASE_PARAMETER_DIRECTORY}
antares.datamanager.thermal.parameter.modulation.directory=${PEGASE_MODULATION_PARAMETER_DIRECTORY}
antares.datamanager.thermal.modulation.output.directory=${PEGASE_PARAM_MODULATION_OUTPUT_DIRECTORY}

antares.datamanager.load.directory=${PEGASE_LOAD_DIRECTORY}
antares.datamanager.load.output.directory=${PEGASE_LOAD_OUTPUT_DIRECTORY}

antares.datamanager.sts.directory=${PEGASE_STS_DIRECTORY}
antares.datamanager.sts.ts.output.directory=${PEGASE_STS_TS_OUTPUT_DIRECTORY}

antares.datamanager.dsr.cluster.directory=${PEGASE_DSR_CLUSTER_DIRECTORY}
antares.datamanager.dsr.capacity.modulation.directory=${PEGASE_DSR_CAPACITY_MODULATION_DIRECTORY}
antares.datamanager.dsr.ts.output.directory=${PEGASE_DSR_TS_OUTPUT_DIRECTORY}

antares.datamanager.misc.capacity.directory=${PEGASE_MISC_CAPACITY_DIRECTORY}
antares.datamanager.misc.load.directory=${PEGASE_MISC_LOAD_DIRECTORY}
antares.datamanager.misc.ts.output.directory=${PEGASE_MISC_TS_OUTPUT_DIRECTORY}

antares.datamanager.res.capacity.directory=${PEGASE_RES_CAPACITY_DIRECTORY}
antares.datamanager.res.load.directory=${PEGASE_RES_LOAD_FACTOR_DIRECTORY}
antares.datamanager.res.distribution.directory=${PEGASE_RES_DISTRIBUTION_DIRECTORY}

antares.datamanager.study.json.output.directory=${PEGASE_STUDY_JSON_OUTPUT_DIRECTORY}

spring.security.oauth2.resourceserver.opaquetoken.introspection-uri=${PEGASE_OAUTH2_INTROSPECTION_URI}
spring.security.oauth2.resourceserver.opaquetoken.client-id=${PEGASE_OAUTH2_CLIENT_ID}
spring.security.oauth2.resourceserver.opaquetoken.client-secret=${PEGASE_OAUTH2_CLIENT_SECRET:}

pegase.nas.directory=/pegase/data
peagse.genarator.host.url=${PEGASE_GENERATOR_HOST_URL}
pegase.enable.authentification=${PEGASE_AUTHENTIFICATION_ACTIVE:false}

# ===============================
# = GAIA CONFIG
# ===============================
rte.ldap.urls=${PEGASE_GAIA_URL}
rte.ldap.base=${PEGASE_GAIA_BASE}
rte.ldap.username=${PEGASE_GAIA_USERNAME}
rte.ldap.password=${PEGASE_GAIA_PASSWORD}